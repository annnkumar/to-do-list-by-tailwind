<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colorful Todo List</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            },
            accent: {
              50: '#fdf4ff',
              100: '#fae8ff',
              200: '#f5d0fe',
              300: '#f0abfc',
              400: '#e879f9',
              500: '#d946ef',
              600: '#c026d3',
              700: '#a21caf',
              800: '#86198f',
              900: '#701a75',
            },
          },
          animation: {
            'bounce-slow': 'bounce 3s infinite',
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .text-gradient {
        @apply bg-clip-text text-transparent bg-gradient-to-r from-primary-500 to-accent-500;
      }
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 to-blue-50 flex flex-col items-center pt-16 px-4">
  <div class="w-full max-w-md bg-white/80 backdrop-blur-sm rounded-2xl shadow-xl border border-white/20 p-6 transition-all duration-300 hover:shadow-2xl">
    <h1 class="text-3xl font-bold text-gradient mb-2">My Tasks</h1>
    <p class="text-slate-500 mb-6">Keep track of your daily activities</p>

    <!-- Add task input -->
    <div class="flex gap-2 mb-8">
      <input type="text" placeholder="Add a new task..." 
        class="flex-1 px-4 py-3 bg-white border-2 border-primary-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-400 focus:border-transparent transition-all duration-300 shadow-sm">
      <button class="bg-gradient-to-r from-primary-500 to-accent-500 hover:from-primary-600 hover:to-accent-600 text-white p-3 rounded-xl transition-all duration-300 shadow-md hover:shadow-lg transform hover:-translate-y-1">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">
          <path d="M5 12h14"></path>
          <path d="M12 5v14"></path>
        </svg>
        <span class="sr-only">Add task</span>
      </button>
    </div>

    <!-- Task list -->
    <div class="space-y-4">
      <!-- Incomplete task - High priority -->
      <div class="flex items-center gap-3 p-4 rounded-xl bg-white border-l-4 border-red-400 shadow-sm hover:shadow-md transition-all duration-300">
        <button class="flex-shrink-0 text-gray-400 hover:text-primary-500 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6">
            <circle cx="12" cy="12" r="10"></circle>
          </svg>
        </button>
        <div>
          <span class="text-gray-800 font-medium">Complete the project proposal</span>
          <div class="flex items-center mt-1">
            <span class="text-xs font-medium mr-2 px-2.5 py-0.5 rounded-full bg-red-100 text-red-800">High Priority</span>
            <span class="text-xs text-gray-500">Due today</span>
          </div>
        </div>
      </div>

      <!-- Completed task -->
      <div class="flex items-center gap-3 p-4 rounded-xl bg-gray-50 border-l-4 border-green-400 shadow-sm transition-all duration-300">
        <button class="flex-shrink-0 text-green-500">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </button>
        <div>
          <span class="text-gray-500 line-through">Research competitors</span>
          <div class="flex items-center mt-1">
            <span class="text-xs font-medium mr-2 px-2.5 py-0.5 rounded-full bg-green-100 text-green-800">Completed</span>
            <span class="text-xs text-gray-500">Yesterday</span>
          </div>
        </div>
      </div>

      <!-- Incomplete task - Medium priority -->
      <div class="flex items-center gap-3 p-4 rounded-xl bg-white border-l-4 border-yellow-400 shadow-sm hover:shadow-md transition-all duration-300">
        <button class="flex-shrink-0 text-gray-400 hover:text-primary-500 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6">
            <circle cx="12" cy="12" r="10"></circle>
          </svg>
        </button>
        <div>
          <span class="text-gray-800 font-medium">Schedule team meeting</span>
          <div class="flex items-center mt-1">
            <span class="text-xs font-medium mr-2 px-2.5 py-0.5 rounded-full bg-yellow-100 text-yellow-800">Medium Priority</span>
            <span class="text-xs text-gray-500">Tomorrow</span>
          </div>
        </div>
      </div>

      <!-- Incomplete task - Low priority -->
      <div class="flex items-center gap-3 p-4 rounded-xl bg-white border-l-4 border-blue-400 shadow-sm hover:shadow-md transition-all duration-300">
        <button class="flex-shrink-0 text-gray-400 hover:text-primary-500 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6">
            <circle cx="12" cy="12" r="10"></circle>
          </svg>
        </button>
        <div>
          <span class="text-gray-800 font-medium">Prepare presentation slides</span>
          <div class="flex items-center mt-1">
            <span class="text-xs font-medium mr-2 px-2.5 py-0.5 rounded-full bg-blue-100 text-blue-800">Low Priority</span>
            <span class="text-xs text-gray-500">Next week</span>
          </div>
        </div>
      </div>

      <!-- Incomplete task - Personal -->
      <div class="flex items-center gap-3 p-4 rounded-xl bg-white border-l-4 border-purple-400 shadow-sm hover:shadow-md transition-all duration-300">
        <button class="flex-shrink-0 text-gray-400 hover:text-primary-500 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6">
            <circle cx="12" cy="12" r="10"></circle>
          </svg>
        </button>
        <div>
          <span class="text-gray-800 font-medium">Review client feedback</span>
          <div class="flex items-center mt-1">
            <span class="text-xs font-medium mr-2 px-2.5 py-0.5 rounded-full bg-purple-100 text-purple-800">Personal</span>
            <span class="text-xs text-gray-500">Friday</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Task summary -->
    <div class="mt-8 pt-6 border-t border-gray-200">
      <div class="flex justify-between text-sm text-gray-500">
        <span>4 tasks remaining</span>
        <button class="text-primary-500 hover:text-primary-700 font-medium">Clear completed</button>
      </div>
    </div>
  </div>

  <!-- Floating action button for mobile -->
  <button class="md:hidden fixed bottom-6 right-6 bg-gradient-to-r from-primary-500 to-accent-500 text-white p-4 rounded-full shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6">
      <path d="M5 12h14"></path>
      <path d="M12 5v14"></path>
    </svg>
  </button>
</body>
</html>
